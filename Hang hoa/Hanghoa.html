<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm Laptop</title>
    <link rel="stylesheet" href="Hanghoa.css" />
</head>
<body>
    <h2 class="sp-title">LAPTOP BÁN CHẠY</h2>
    <div class="sp-box">
        <img class="sp-box-img" src="s16.jpeg" alt="Asus Vivobook S16" />
        <img class="sp-box-new" src="iconnew.png" alt="New" />
        <div class="sp-box-oldprice">27,990,000 đ</div>
        <div class="sp-box-price">24,990,000 đ</div>
        <div class="sp-box-icons">
            <img src="Basket.png" alt="Mua hàng" title="Thêm vào giỏ">
            <img src="Favourites.png" alt="Yêu thích" title="Yêu thích">
            <img src="Letter.png" alt="Liên hệ" title="Liên hệ">
        </div>
        <div class="sp-box-name">Asus Vivobook S16</div>
    </div>
    <div class="sp-box">
        <img class="sp-box-img" src="laptop.png" alt="Asus Vivobook 14" />
        <div class="sp-box-oldprice">17,490,000 đ</div>

        <div class="sp-box-icons">

        </div>

    <div class="sp-box">

        <div class="sp-box-name">Asus Vivobook Pro 15</div>
    </div>
    <div class="sp-box">
        <img class="sp-box-img" src="zbook14.jpeg" alt="Asus Zenbook 14" />
        <div class="sp-box-oldprice">29,000,000 đ</div>
        <div class="sp-box-price">26,500,000 đ</div>
        <div class="sp-box-icons">
            <img src="Basket.png" alt="Mua hàng" title="Thêm vào giỏ">

            <img src="Letter.png" alt="Liên hệ" title="Liên hệ">
        </div>
        <div class="sp-box-name">Asus Zenbook 14</div>
    </div>
    <div class="sp-box">
        <img class="sp-box-img" src="go15.png" alt="Asus Vivobook Go 15" />

        <div class="sp-box-price">11,990,000 đ</div>
