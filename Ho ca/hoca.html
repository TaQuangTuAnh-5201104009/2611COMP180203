<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ cá - Tạ Quang Tú Anh</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, lightsalmon, navajowhite, lightyellow);
        }

        h2 {
            text-align: center;
            margin: 0;
            padding: 24px 10px 10px;
            font-size: clamp(24px, 5vw, 40px);
            color: white;
            text-shadow: 3px 3px 0 lightcoral, 6px 6px 0 steelblue;
            letter-spacing: 2px;
        }
        #mattroi {
            position: fixed;
            top: 90px;
            right: 8vw;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: gold;
            box-shadow: 0 0 40px 20px orange;
            animation: toa 4s ease-in-out infinite alternate;
        }
        @keyframes toa {
            from { box-shadow: 0 0 30px 14px orange; }
            to   { box-shadow: 0 0 55px 28px orange; }
        }
        .quaylai {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 20;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.85);
            color: #1b365d;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
        }
        .quaylai:hover {
            background: white;
        }

        #hoca {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 62vh;
            border: 4px double white;
            border-top: 0;
            background: linear-gradient(to bottom, skyblue, deepskyblue, midnightblue);
            overflow: hidden;
            cursor: pointer;
        }

        .sinhvat {
            --h: 1;
            position: absolute;
            left: 0;
            width: var(--w);
            height: auto;
            user-select: none;
            -webkit-user-drag: none;
        }

        @keyframes boi {
            0%   { translate: 0 0;                          scale: var(--h) 1; }
            48%  { translate: calc(100vw - var(--w)) 0;     scale: var(--h) 1; }
            50%  { translate: calc(100vw - var(--w)) 0;     scale: calc(var(--h) * -1) 1; }
            98%  { translate: 0 0;                          scale: calc(var(--h) * -1) 1; }
            100% { translate: 0 0;                          scale: var(--h) 1; }
        }
        @keyframes lach {
            0%   { transform: translateY(0); }
            25%  { transform: translateY(-40px); }
            50%  { transform: translateY(30px); }
            75%  { transform: translateY(-20px); }
            100% { transform: translateY(0); }
        }

        #map {
            --w: clamp(130px, 20vw, 240px);
            top: 8%;
            z-index: 5;
            animation: boi 22s linear infinite, lach 7s ease-in-out infinite;
        }
        #cavang {
            --w: clamp(110px, 17vw, 200px);
            top: 38%;
            z-index: 4;
            animation: boi 30s linear -9s infinite, lach 9s ease-in-out -2s infinite;
        }
        #camo {
            --w: clamp(100px, 15vw, 180px);
            top: 24%;
            z-index: 3;
            animation: boi 36s linear -20s infinite, lach 11s ease-in-out -5s infinite;
        }
        #rua {
            --w: clamp(80px, 11vw, 140px);
            top: 56%;
            z-index: 4;
            animation: boi 55s linear -12s infinite, lach 13s ease-in-out infinite;
        }

        @keyframes troi {
            0%   { transform: translate(0, 0) rotate(-6deg); }
            50%  { transform: translate(30px, -45px) rotate(6deg); }
            100% { transform: translate(0, 0) rotate(-6deg); }
        }
        .tholan {
            position: absolute;
            width: clamp(60px, 8vw, 100px);
            height: auto;
            z-index: 6;
            animation: troi 8s ease-in-out infinite;
            user-select: none;
            -webkit-user-drag: none;
        }
        #t1 { left: 10%; top: 35%; }
        #t2 { left: 46%; top: 50%; animation-delay: -3s; animation-duration: 10s; }
        #t3 { left: 78%; top: 30%; animation-delay: -6s; animation-duration: 9s; }

        /* Bong bóng */
        @keyframes noi {
            0%   { translate: 0 0;      opacity: 1; }
            100% { translate: 0 -70vh;  opacity: 0; }
        }
        .bong {
            position: absolute;
            bottom: 0;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            border: 2px solid white;
            animation: noi 6s linear infinite;
            pointer-events: none;
        }

        #cat {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45px;
            background-color: burlywood;
            border-top: 4px solid peru;
            z-index: 7;
        }
        @keyframes lac {
            from { rotate: -8deg; }
            to   { rotate: 8deg; }
        }
        .rong {
            position: absolute;
            bottom: 40px;
            width: 18px;
            background-color: seagreen;
            border-radius: 50% 50% 0 0;
            transform-origin: bottom;
            animation: lac 3s ease-in-out infinite alternate;
            z-index: 6;
        }
    </style>
</head>
<body>
    <a class="quaylai" href="../index.html">← Trang chủ</a>
    <h2>Tạ Quang Tú Anh - 52.01.104.009</h2>
    <div id="mattroi"></div>

    <div id="hoca">
        <img class="sinhvat" id="camo"  src="faintSchool.png"    alt="Đàn cá mờ"    onerror="this.style.display='none'">
        <img class="sinhvat" id="cavang" src="goldFishSchool.png" alt="Đàn cá vàng"  onerror="this.style.display='none'">
        <img class="sinhvat" id="rua"   src="turtle.png"         alt="Rùa biển"     onerror="this.style.display='none'">
        <img class="sinhvat" id="map"   src="shark.png"          alt="Cá mập"       onerror="this.style.display='none'">

        <img class="tholan" id="t1" src="diver1.png" alt="Thợ lặn 1" onerror="this.style.display='none'">
        <img class="tholan" id="t2" src="diver2.png" alt="Thợ lặn 2" onerror="this.style.display='none'">
        <img class="tholan" id="t3" src="diver3.png" alt="Thợ lặn 3" onerror="this.style.display='none'">

        <div id="cat"></div>
    </div>

    <script>
        var hoca = document.getElementById("hoca");
        var cat = document.getElementById("cat");

        function taoBong(x, kichThuoc, troChuyen) {
            var b = document.createElement("div");
            b.className = "bong";
            b.style.left = x + "px";
            b.style.width = b.style.height = kichThuoc + "px";
            b.style.animationDuration = (4 + Math.random() * 4) + "s";
            if (troChuyen) {
                b.style.animationIterationCount = "1";
                b.style.bottom = troChuyen + "px";
                b.addEventListener("animationend", function () { b.remove(); });
            } else {
                b.style.animationDelay = (-Math.random() * 6) + "s";
            }
            hoca.appendChild(b);
        }
        for (var i = 0; i < 14; i++) {
            taoBong(Math.random() * window.innerWidth, 10 + Math.random() * 20);
        }

        var viTri = [4, 6, 18, 30, 44, 50, 63, 76, 88, 91];
        viTri.forEach(function (p, i) {
            var r = document.createElement("div");
            r.className = "rong";
            r.style.left = p + "%";
            r.style.height = (80 + Math.random() * 70) + "px";
            r.style.animationDelay = (-i * 0.6) + "s";
            hoca.appendChild(r);
        });

        hoca.addEventListener("click", function (e) {
            var y = hoca.getBoundingClientRect().bottom - e.clientY;
            for (var i = 0; i < 4; i++) {
                taoBong(e.clientX + (Math.random() * 40 - 20), 8 + Math.random() * 16, y);
            }
        });
    </script>
</body>
</html>
